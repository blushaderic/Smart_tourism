version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart_tourism_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - smart_tourism_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart_tourism_server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/smart_tourism?authSource=admin
      JWT_SECRET: your_jwt_secret_here
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - smart_tourism_network

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: smart_tourism_ai
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: development
      FLASK_PORT: 5001
    volumes:
      - ./ai_service:/app
    networks:
      - smart_tourism_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart_tourism_client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_AI_SERVICE_URL: http://localhost:5001
    depends_on:
      - server
      - ai_service
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - smart_tourism_network

volumes:
  mongodb_data:

networks:
  smart_tourism_network:
    driver: bridge

